services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rollout_guard
      POSTGRES_USER: rollout_guard
      POSTGRES_PASSWORD: rollout_guard
    ports:
      - "5432:5432"
    volumes:
      - rollout_guard_postgres:/var/lib/postgresql/data
      - ./apps/database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rollout_guard -d rollout_guard"]
      interval: 5s
      timeout: 5s
      retries: 10

  stable:
    build:
      context: .
      dockerfile: apps/demo-service/Dockerfile
    environment:
      APP_VERSION: v1
      ERROR_RATE: "0"
      RESPONSE_DELAY_MS: "50"
      PORT: "3000"
    ports:
      - "3001:3000"

  candidate:
    build:
      context: .
      dockerfile: apps/demo-service/Dockerfile
    environment:
      APP_VERSION: v2
      ERROR_RATE: "0.15"
      RESPONSE_DELAY_MS: "300"
      PORT: "3000"
    ports:
      - "3002:3000"

  local-router:
    build:
      context: .
      dockerfile: apps/local-router/Dockerfile
    environment:
      PORT: "8080"
      STABLE_URL: http://stable:3000
      CANDIDATE_URL: http://candidate:3000
      STABLE_REVISION_ID: v1
      CANDIDATE_REVISION_ID: v2
      STABLE_WEIGHT: "100"
      CANDIDATE_WEIGHT: "0"
      UPSTREAM_TIMEOUT_MS: "2000"
    ports:
      - "8080:8080"
    depends_on:
      stable:
        condition: service_started
      candidate:
        condition: service_started

  rollout-worker:
    build:
      context: .
      dockerfile: apps/rollout-worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://rollout_guard:rollout_guard@postgres:5432/rollout_guard
      STABLE_REVISION_ID: v1
      STABLE_URL: http://stable:3000
      CANDIDATE_REVISION_ID: v2
      CANDIDATE_URL: http://candidate:3000
      ROUTER_URL: http://local-router:8080
      POLL_INTERVAL_MS: "1000"
      HTTP_TIMEOUT_MS: "2000"
      MAXIMUM_RETRY_ATTEMPTS: "5"
      MAXIMUM_ROLLBACK_ATTEMPTS: "5"
      RETRY_BASE_DELAY_MS: "1000"
      RETRY_MAXIMUM_DELAY_MS: "30000"
    depends_on:
      postgres:
        condition: service_healthy
      local-router:
        condition: service_started

  control-api:
    build:
      context: .
      dockerfile: apps/control-api/Dockerfile
    environment:
      DATABASE_URL: postgresql://rollout_guard:rollout_guard@postgres:5432/rollout_guard
      ROUTER_URL: http://local-router:8080
      DASHBOARD_ORIGIN: http://localhost:3000
      PORT: "3005"
    ports:
      - "3005:3005"
    depends_on:
      postgres:
        condition: service_healthy
      local-router:
        condition: service_started

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        VITE_API_URL: http://localhost:3005
    ports:
      - "3000:80"
    depends_on:
      control-api:
        condition: service_started

volumes:
  rollout_guard_postgres:
